<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bauru</title>
  <link rel="icon" href="icons/map.png" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<div id="mapa"></div>

<section id="dashboard-panel">
  <div class="dashboard-content">
    <div class="dashboard-header">
      <h2>Dashboard de Ocorrências</h2>
      <button id="dashboard-close" type="button">Voltar ao mapa</button>
    </div>
    <div class="dashboard-feedback" aria-live="polite"></div>
    <div class="dashboard-chart">
      <h3>Ocorrências por Tema</h3>
      <canvas id="chart-temas"></canvas>
    </div>
    <div class="dashboard-chart">
      <h3>Evolução Temporal de Ocorrências</h3>
      <canvas id="chart-temporal"></canvas>
    </div>
    <div class="dashboard-chart">
      <h3>Principais Endereços</h3>
      <canvas id="chart-enderecos"></canvas>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>
</html>
